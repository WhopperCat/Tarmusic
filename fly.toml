# fly.toml — Tarmusic on Fly.io
# Edit `app` to a unique name before `fly launch`, or let `fly launch` overwrite this file.

app = "tarmusic"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[env]
  PORT = "8080"
